# --- Database Configuration (for Tests) ---
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# --- RabbitMQ Configuration (for Tests) ---
spring.autoconfigure.exclude=\
org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration,\
org.springframework.boot.test.autoconfigure.amqp.RabbitTestAutoConfiguration

# --- NEW: Security Configuration (for Tests) ---
# This is the minimal property required to make the
# OAuth2 Resource Server context load successfully.
# We use a dummy URL because this test only checks if the
# context can load, not if it can validate a real token.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://example.com/oauth2/jwks