# --- Database Configuration (for Tests) ---
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# --- RabbitMQ Configuration (for Tests) ---
# DECISION: Exclude both standard and test RabbitMQ auto-configurations
# WHY: We are not testing messaging yet, so we prevent Spring from
# trying to connect to a broker, which would cause the test to fail.
spring.autoconfigure.exclude=\
org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration,\
org.springframework.boot.test.autoconfigure.amqp.RabbitTestAutoConfiguration