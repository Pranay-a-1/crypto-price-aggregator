# Testcontainers Configuration
# This file configures Testcontainers to use the local Docker daemon

# Use local Docker daemon via Unix socket
docker.client.strategy=org.testcontainers.dockerclient.UnixSocketClientProviderStrategy

# Reuse containers across test runs for faster execution (optional)
testcontainers.reuse.enable=false

# Disable Ryuk container cleanup (if causing issues)
# testcontainers.ryuk.disabled=false
