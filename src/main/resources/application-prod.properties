# =============================================================================
# Production Profile Configuration
# =============================================================================
# This file overrides settings from application.properties when running with
# the 'prod' profile: mvn spring-boot:run -Dspring-boot.run.profiles=prod
#
# Focus: Reduced logging, production-ready settings
# =============================================================================

# --- Logging Configuration (Production - Less Verbose) ---
# Only log warnings and errors by default
logging.level.root=WARN

# Your application logs at INFO level (not DEBUG)
logging.level.com.cryptoArb=INFO

# Reduce Spring framework noise
logging.level.org.springframework=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.boot=WARN

# Hibernate/JPA - Only errors
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN

# --- Disable SQL Statement Logging ---
# In production, we don't want to log every SQL query
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- H2 Console (Disable in Production) ---
spring.h2.console.enabled=false

# =============================================================================
# Production Database Configuration (When Ready)
# =============================================================================
# When you're ready to use PostgreSQL/TimescaleDB instead of H2:
#
# spring.datasource.url=jdbc:postgresql://localhost:5432/cryptodb
# spring.datasource.driverClassName=org.postgresql.Driver
# spring.datasource.username=crypto_user
# spring.datasource.password=your_secure_password
#
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.hibernate.ddl-auto=validate  # Don't auto-create tables in prod!
#
# Note: Use Flyway/Liquibase for production schema management

# =============================================================================
# Optional Production Tuning
# =============================================================================

# Reduce scheduled task frequency if needed (currently 5000ms in default config)
# cpa.fetch-interval-ms=10000

# Production-grade connection pool settings (defaults are already good)
# spring.datasource.hikari.maximum-pool-size=20
# spring.datasource.hikari.minimum-idle=5

# Actuator - Only expose necessary endpoints in production
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=when-authorized
