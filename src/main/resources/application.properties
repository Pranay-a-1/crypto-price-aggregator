# =============================================================================
# Cryptocurrency Price Aggregator - Application Configuration
# =============================================================================

# --- Application Info ---
spring.application.name=crypto-price-aggregator

# --- Server Configuration ---
server.port=8080

# change the swagger-ui entry point if you want /swagger-ui.html to work
springdoc.swagger-ui.path=/swagger-ui.html

# --- Database Configuration ---
# IMPORTANT: Use different profiles for dev (H2) and prod (TimescaleDB)
# This is the DEFAULT (dev) configuration
spring.datasource.url=jdbc:h2:mem:devdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# --- H2 Console (Dev Only) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- OAuth2 Resource Server Configuration ---
# CRITICAL: This is the public key endpoint from your Identity Provider
# Spring Security will fetch the public keys (JWKs) from this URL
# to validate JWT signatures.
#
# Replace this with your actual IdP's JWKS endpoint:
# - Okta: https://{yourOktaDomain}/oauth2/default/v1/keys
# - Auth0: https://{yourAuth0Domain}/.well-known/jwks.json
# - Keycloak: https://{keycloakUrl}/realms/{realm}/protocol/openid-connect/certs
#
# For local development/testing, you can use a mock server or skip this
# by excluding security auto-configuration in tests.
#spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://example.com/oauth2/jwks
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost/mock-jwks

# Exclude security auto-configuration in tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration


spring.cloud.config.enabled=false
spring.cloud.bootstrap.enabled=false
spring.cloud.refresh.enabled=false


# Optional: Specify expected JWT issuer (adds extra validation)
# spring.security.oauth2.resourceserver.jwt.issuer-uri=https://your-idp.com

# --- RabbitMQ Configuration ---
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# --- Logging Configuration ---
logging.level.root=INFO
logging.level.com.cryptoArb=DEBUG
logging.level.org.springframework.security=DEBUG

logging.level.com.cryptoArb.interceptor=DEBUG
logging.level.com.cryptoArb.config=DEBUG

# --- Actuator Configuration ---
# Enable all actuator endpoints for observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always


# =============================================================================
# Resilience4j Configuration
# =============================================================================

# --- Circuit Breaker Instances ---
# "coinbase" matches @CircuitBreaker(name = "coinbase")

# 1. Sliding Window: Count-based vs Time-based
# We use COUNT_BASED. It looks at the last 10 calls.
resilience4j.circuitbreaker.instances.coinbase.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.coinbase.slidingWindowSize=10

# 2. Failure Threshold
# If 50% of the last 10 calls fail (i.e., 5 failures), OPEN the circuit.
resilience4j.circuitbreaker.instances.coinbase.failureRateThreshold=50

# 3. Open State Behavior
# Wait 5 seconds before moving to HALF_OPEN to check if the service recovered.
resilience4j.circuitbreaker.instances.coinbase.waitDurationInOpenState=5000ms

# 4. Half-Open Behavior
# Allow 3 requests to pass through. If they succeed, CLOSE the circuit.
resilience4j.circuitbreaker.instances.coinbase.permittedNumberOfCallsInHalfOpenState=3

# 5. Slow Call Thresholds (Optional but recommended)
# Consider any call taking longer than 2s as "slow" even if it succeeds.
resilience4j.circuitbreaker.instances.coinbase.slowCallDurationThreshold=2000ms
# If 50% of calls are slow, OPEN the circuit.
resilience4j.circuitbreaker.instances.coinbase.slowCallRateThreshold=50

# --- Actuator Exposure ---
# Ensure resilience metrics are exposed for monitoring (Prometheus/Grafana)
management.health.circuitbreakers.enabled=true



# =============================================================================
# CPA Custom Properties
# =============================================================================
cpa.fetch-interval-ms=5000
cpa.exchanges.enabled[0]=coinbase
cpa.exchanges.enabled[1]=binance

# CORS Configuration
# This matches the "Green" phase hardcoded value, but now it's configurable
cpa.cors.allowed-origins[0]=http://localhost:3000
