# =============================================================================
# Cryptocurrency Price Aggregator - Application Configuration
# =============================================================================

# --- Application Info ---
spring.application.name=crypto-price-aggregator

# --- Server Configuration ---
server.port=8080

# change the swagger-ui entry point if you want /swagger-ui.html to work
springdoc.swagger-ui.path=/swagger-ui.html

# --- Database Configuration ---
# IMPORTANT: Use different profiles for dev (H2) and prod (TimescaleDB)
# This is the DEFAULT (dev) configuration
spring.datasource.url=jdbc:h2:mem:devdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# --- H2 Console (Dev Only) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- OAuth2 Resource Server Configuration ---
# CRITICAL: This is the public key endpoint from your Identity Provider
# Spring Security will fetch the public keys (JWKs) from this URL
# to validate JWT signatures.
#
# Replace this with your actual IdP's JWKS endpoint:
# - Okta: https://{yourOktaDomain}/oauth2/default/v1/keys
# - Auth0: https://{yourAuth0Domain}/.well-known/jwks.json
# - Keycloak: https://{keycloakUrl}/realms/{realm}/protocol/openid-connect/certs
#
# For local development/testing, you can use a mock server or skip this
# by excluding security auto-configuration in tests.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://example.com/oauth2/jwks

# Optional: Specify expected JWT issuer (adds extra validation)
# spring.security.oauth2.resourceserver.jwt.issuer-uri=https://your-idp.com

# --- RabbitMQ Configuration ---
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# --- Logging Configuration ---
logging.level.root=INFO
logging.level.com.cryptoArb=DEBUG
logging.level.org.springframework.security=DEBUG

logging.level.com.cryptoArb.interceptor=DEBUG
logging.level.com.cryptoArb.config=DEBUG

# --- Actuator Configuration ---
# Enable all actuator endpoints for observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# =============================================================================
# NOTES:
#
# 1. Security: In production, use environment variables for sensitive data:
#    spring.datasource.password=${DB_PASSWORD}
#    spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${JWT_JWKS_URI}
#
# 2. Profiles: Create separate profile files:
#    - application-dev.properties (H2, relaxed logging)
#    - application-prod.properties (TimescaleDB, structured JSON logging)
#
# 3. Flyway: Database migrations will be configured in Phase 11 task
#
# 4. SSL/TLS: In production, enable HTTPS:
#    server.ssl.enabled=true
#    server.ssl.key-store=classpath:keystore.p12
#    server.ssl.key-store-password=${SSL_PASSWORD}
# =============================================================================