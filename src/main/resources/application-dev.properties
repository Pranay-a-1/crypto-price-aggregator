# =============================================================================
# Development Profile Configuration
# =============================================================================
# Activate with: --spring.profiles.active=dev
# or: SPRING_PROFILES_ACTIVE=dev

# --- Database Configuration (H2 In-Memory) ---
spring.datasource.url=jdbc:h2:mem:devdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=


# change the swagger-ui entry point if you want /swagger-ui.html to work
springdoc.swagger-ui.path=/swagger-ui.html

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# --- H2 Console (Enabled for Dev) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Logging (Verbose for Dev) ---
logging.level.root=INFO
logging.level.com.cryptoArb=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# --- Security (Relaxed for Local Testing) ---
# Use a mock JWKS endpoint or configure a local Keycloak/mock auth server
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/oauth2/jwks

# --- RabbitMQ (Local Docker Instance) ---
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# --- Actuator (Full Access for Dev) ---
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always


logging.level.com.cryptoArb.interceptor=DEBUG
logging.level.com.cryptoArb.config=DEBUG


# Exclude security auto-configuration in tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Disable cloud config for dev environment
spring.cloud.config.enabled=false
spring.cloud.bootstrap.enabled=false
spring.cloud.refresh.enabled=false

# =============================================================================
# Resilience4j Configuration
# =============================================================================

# --- Circuit Breaker Instances ---
# "coinbase" matches @CircuitBreaker(name = "coinbase")

# 1. Sliding Window: Count-based vs Time-based
# We use COUNT_BASED. It looks at the last 10 calls.
resilience4j.circuitbreaker.instances.coinbase.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.coinbase.slidingWindowSize=10

# 2. Failure Threshold
# If 50% of the last 10 calls fail (i.e., 5 failures), OPEN the circuit.
resilience4j.circuitbreaker.instances.coinbase.failureRateThreshold=50

# 3. Open State Behavior
# Wait 5 seconds before moving to HALF_OPEN to check if the service recovered.
resilience4j.circuitbreaker.instances.coinbase.waitDurationInOpenState=5000ms

# 4. Half-Open Behavior
# Allow 3 requests to pass through. If they succeed, CLOSE the circuit.
resilience4j.circuitbreaker.instances.coinbase.permittedNumberOfCallsInHalfOpenState=3

# 5. Slow Call Thresholds (Optional but recommended)
# Consider any call taking longer than 2s as "slow" even if it succeeds.
resilience4j.circuitbreaker.instances.coinbase.slowCallDurationThreshold=2000ms
# If 50% of calls are slow, OPEN the circuit.
resilience4j.circuitbreaker.instances.coinbase.slowCallRateThreshold=50

# --- Actuator Exposure ---
# Ensure resilience metrics are exposed for monitoring (Prometheus/Grafana)
management.health.circuitbreakers.enabled=true